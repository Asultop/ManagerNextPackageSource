alias -MOUSE_WHEEL "alias i mouse_wheel_none;alias 0 alias i mouse_wheel_up;alias 1 alias i mouse_wheel_down;^;i;mouse_wheel;alias ^"
alias mouse_wheel
alias mouse_wheel_none "lookatweapon -32767 0 0;lookatweapon 1 0 0;lookatweapon -32767 0 0"
alias mouse_wheel_up "jump 1 0 0;jump -32767 0 0"
alias mouse_wheel_down player_ping
alias mouse_left ""
alias mouse_right ""


