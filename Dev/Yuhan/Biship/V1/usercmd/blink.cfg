alias async_blink "blink.Attack"

alias blink_init "alias blink.Attack"

alias +blink_attack "alias blink.Attack blink_attack_1"
alias -blink_attack "alias blink.Attack"
alias blink_attack_0 "attack -32767 0 0;alias blink.Attack blink_attack_1"
alias blink_attack_1 "attack 1 0 0;alias blink.Attack blink_attack_0"


blink_init