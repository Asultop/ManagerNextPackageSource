sv_playerradio_use_allowlist false // 證明不是自訂無線電
sv_radio_throttle_window 0         // 移除延遲

// 數字含意為radiopanel對應的按鍵, radio1 - standard(#SFUI_CommandRadio), radio2 - group(#SFUI_StandardRadio), radio3 - report(#SFUI_ReportRadio),
//  radio(0) - common(#SFUI_CommonRadio) 不支持menuselect
coverme     // menuselect: 1-
takepoint   // menuselect: 2-- hotkey: --3-
holdpos     // menuselect: 3-- hotkey: 44--
regroup     // menuselect: 4-
followme    // menuselect: 5-- hotkey: 55--
takingfire  // menuselect: 6-
go          // menuselect: -1- hotkey: -1--
fallback    // menuselect: -2- hotkey: -2--
sticktog    // menuselect: -3- hotkey: -3--
thanks      // menuselect: -1- hotkey: 6-5-
cheer       //                 hotkey: 3-3-
compliment  //                 hotkey: --4-
report      // menuselect: 060
roger       // menuselect: --1 hotkey: 1-1- ,隨機 Radio.Roger 或者 Radio.Affirmitive, 代碼: if ( random->RandomInt( 0,1 ) )
enemyspot   // menuselect: --2 hotkey: ---1
needbackup  // menuselect: --3 hotkey: ---2
sectorclear // menuselect: --4 hotkey: ---4
inposition  // menuselect: --5 hotkey: ---5
reportingin // menuselect: --6
getout      // menuselect: --7
negative    // menuselect: --9 hotkey: 2-2-
enemydown   //
// radio2(SEL 4 = getinpos, 5 = stormfront)

