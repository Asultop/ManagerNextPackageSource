alias local.Init 1
// +-起始的指令不會轉發到伺服器, 僅用於防止偵測
-biship
alias -biship alias local.Init 0


exec biship/linker
exec biship/config
exec biship/framework
exec biship/usercmd/method
exec biship/usercmd/async
async_usercmd_reset
exec biship/usercmd/blink

alias 0
alias 1 "exec biship/profile;exec biship/bind";biship.Bind
alias 0 exec biship/usercmd/general;alias 1 exec biship/mirror;biship.Mirror
alias 0
alias 1 "exec biship/yaw/alias;exec biship/yaw/bind";biship.Yaw