// 必须：初始化输入设备状态，参数固定。
player0_using_joystick 0

// 必须：设置默认 m_yaw，参数固定。
alias default.m_yaw m_yaw 0.022

// 必须：设置默认 m_pitch，参数固定。
alias default.m_pitch m_pitch 0.022

// 必须：设置默认 sensitivity，参数固定。
alias default.sensitivity sensitivity 1.4

// 必须：设置默认 sensitivity_y_scale，参数固定。
alias default.sensitivity_y sensitivity_y_scale 1

// 必须：设置默认 radial menu deadzone，参数固定。
alias default.cl_radialmenu_deadzone_size cl_radialmenu_deadzone_size 0.4

// 可变：quickinv 文件路径，通常由上游 line 输入决定。
alias default.cl_quickinventory_filename cl_quickinventory_filename cfg/biship/quickinv/any.txt

// 必须：立即应用默认 m_yaw 别名，参数无变化。
default.m_yaw

// 必须：立即应用默认 m_pitch 别名，参数无变化。
default.m_pitch

// 必须：立即应用默认 sensitivity 别名，参数无变化。
default.sensitivity

// 必须：立即应用默认 sensitivity_y 别名，参数无变化。
default.sensitivity_y

// 可选：应用入口快捷别名，参数固定。
alias .a exec biship/app

// 可选：框架入口快捷别名，参数固定。
alias .f exec biship/framework

// 可选：日志调试快捷别名，参数固定。
alias .e log_flags Console General InputService -DoNotEcho

// 可选：绑定配置入口快捷别名，参数固定。
alias .k exec biship/bind

// 可选：主配置入口快捷别名，参数固定。
alias .p exec biship/config

// 可选：退出并不重启，参数固定。
alias .q "engine_relaunch_app_before_exiting false;quit"

// 可选：退出并重启，参数固定。
alias .r "engine_relaunch_app_before_exiting true;quit"

// 可选：输入配置入口快捷别名，参数固定。
alias .i exec biship/input

// 可选：切换为自动选队，参数固定。
alias .select ent_fire !self changeteam 0

// 可选：切换到观战，参数固定。
alias .setspec ent_fire !self changeteam 1

// 可选：切换到恐怖分子，参数固定。
alias .sett ent_fire !self changeteam 2

// 可选：切换到反恐精英，参数固定。
alias .setct ent_fire !self changeteam 3

// 可选：自动加队，参数固定。
alias .auto jointeam 0 1

// 可选：快捷加入 CT，参数固定。
alias .ct jointeam 3 1

// 可选：快捷加入 T，参数固定。
alias .t jointeam 2 1

// 可选：快捷观战，参数固定。
alias .spec spectate

// 可选：临时调试开关，参数固定。
alias .dbg "sv_radio_throttle_window 0;sv_playerradio_use_allowlist 0"

// 可变：控制台位置和尺寸，通常按手动 line 调整。
alias .reset panorama_console_position_and_size 524.00|121.00|1000.00|800.00

// 可选：主界面重载入口，参数固定。
alias ~ exec biship/app/main

// 必须：加载基础应用配置，路径固定。
exec biship/app

// 可选：提供应用重载入口，参数固定。
alias APP_RELOAD exec biship/app/main

// 可选：内部重载快捷别名，参数固定。
alias . internal_reload

// 可选：上一页快捷别名，参数固定。
alias , internal_pageprev

// 可选：确认快捷别名，参数固定。
alias y internal_confirm

// 可选：取消快捷别名，参数固定。
alias n internal_cancel

// 必须：加载基础本地化资源，路径固定。
exec biship/localized/biship

// 必须：加载繁中本地化资源，路径固定。
exec biship/localized/tchinese

// 必须：加载主题资源，路径固定。
exec biship/theme/biship

// 必须：初始化界面状态位，参数固定。
alias interface.Clear 0

// 必须：初始化对话框状态位，参数固定。
alias interface.Dialog 0

// 必须：初始化对话框例外状态位，参数固定。
alias interface.Dialog.Except 0

// 必须：初始化界面重载标记，参数固定。
alias interface.Reload 1

// 可选：日志输出控制占位，当前为空，后续可按 line/option 填充。
alias logflags.Control //"log_flags General InputService -DoNotEcho; log_Flags Console -DoNotEcho" // 防止输出[Console] Enable ..

// 可变：队伍限制规则，通常随 option/模式切换。
alias jointeam.Restricted "alias -casual 1;alias -armsrace 0;alias -competitive 1;alias -wingman 1;alias -deathmatch 0;alias -new_user_training 1;alias -retakes 1;cvar.GameMode"

// 可选：掉落限制总开关，参数固定。
alias drop.Restricted.Any 1

// 可变：主武器掉落规则，引用 cvar，可能随规则变化。
alias drop.Restricted.Primary cvar.MpDeathDropGun

// 可变：副武器掉落规则，引用 cvar，可能随规则变化。
alias drop.Restricted.Secondary cvar.MpDeathDropGun

// 可变：匕首掉落规则，引用 cvar，可能随规则变化。
alias drop.Restricted.Knife cvar.MpDropKnifeEnable

// 可变：手雷掉落规则，引用 cvar，可能随规则变化。
alias drop.Restricted.Grenades cvar.MpDropGrenadeEnable

// 可变：C4 掉落规则，引用 cvar，可能随规则变化。
alias drop.Restricted.C4 cvar.MpDeathDropC4

// 可选：武器占位别名，当前为空，后续可填命令。
alias biship.Any ""

// 可选：主武器占位别名，当前为空，后续可填命令。
alias biship.Primary ""

// 可选：副武器占位别名，当前仅绑定预设命令。
alias biship.Secondary "preset.SetAutoAttack"

// 可选：刀具占位别名，当前为空，后续可填命令。
alias biship.Knife ""

// 可选：手雷占位别名，当前为空，后续可填命令。
alias biship.Grenades ""

// 可选：C4 占位别名，当前为空，后续可填命令。
alias biship.C4 ""

// 可选：高爆手雷占位别名，当前为空，后续可填命令。
alias biship.HEGrenade ""

// 可选：闪光弹占位别名，当前为空，后续可填命令。
alias biship.Flashbang ""

// 可选：烟雾弹占位别名，当前为空，后续可填命令。
alias biship.SmokeGrenade ""

// 可选：诱饵弹占位别名，当前为空，后续可填命令。
alias biship.DecoyGrenade ""

// 可选：燃烧弹占位别名，当前为空，后续可填命令。
alias biship.Molotov ""

// 可选：电击枪占位别名，当前为空，后续可填命令。
alias biship.Taser ""

// 可选：生命补充占位别名，当前为空，后续可填命令。
alias biship.HealthBoost ""

// 可选：电击枪记忆开关，参数固定为 1。
alias biship.TaserStore 1

// 可选：手雷模式记忆开关，参数固定为 1。
alias biship.GrenadesMode 1

// 可选：调试总开关，参数固定。
alias biship.Debug 1

// 可选：镜像模式开关，参数固定。
alias biship.Mirror 0

// 可选：绑定总开关，参数固定。
alias biship.Bind 1

// 可选：不隐藏购买菜单开关，参数固定。
alias biship.NoHideBuyMenu 1

// 可选：消息输出开关，参数固定。
alias biship.Message 0

// 可选：语音/电台开关，参数固定。
alias biship.Radio 0

// 可选：默认队伍编号，参数固定。
alias biship.Team 4

// 可变：竞技模式映射，内容可按 option 选择调整。
alias competitive.GameMode          ""

// 可变：搭档模式映射，内容可按 option 选择调整。
alias wingman.GameMode              ""

// 可变：休闲模式映射，内容可按 option 选择调整。
alias casual.GameMode               "alias _biship.Team 4;alias _biship.Message 1" // 例子: 休闲模式 加入队伍'自動選擇' 並 忽略所有聊天

// 可变：死亡竞赛模式映射，内容可按 option 选择调整。
alias deathmatch.GameMode           "alias drop.Restricted 2;alias _biship.Team 2;alias _biship.Message 1;alias _biship.Radio 1"

// 可变：军备竞赛模式映射，内容可按 option 选择调整。
alias armsrace.GameMode             ""

// 可变：新手训练模式映射，内容可按 option 选择调整。
alias new_user_training.GameMode    ""

// 可变：残局模式映射，内容可按 option 选择调整。
alias retakes.GameMode              ""

